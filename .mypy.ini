[mypy]
explicit_package_bases = True
namespace_packages = True
mypy_path = ..
exclude = (?x)^(backups/|tmp/|dev/|demo/|lib/yaml)
ignore_missing_imports = True
ignore_errors = True
no_strict_optional = True

[mypy-lib.yaml.*]
ignore_errors = True

[mypy-CharMorphExpansion.lib.yaml.*]
ignore_errors = True

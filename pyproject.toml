[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "libavicreator"
version = "0.1.0"
description = "Standalone compiled native core engine for character morphing, spatial queries, mesh fitting, and rigging"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.20.0"
]

[tool.maturin]
features = ["python"]
module-name = "libavicreator"

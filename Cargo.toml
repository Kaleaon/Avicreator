[workspace]
members = [
    "crates/avicreator-schema",
    "crates/avicreator-core",
    "crates/avicreator-wasm",
    "crates/avicreator-ffi",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Avicreator Core Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Kaleaon/Avicreator"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["console"] }
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
thiserror = "1.0"
cbindgen = "0.27"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package]
name = "avicreator-core"
version = "0.1.0"
edition = "2021"
authors = ["Avicreator Core Team"]
description = "Standalone compiled native core engine for character morphing, spatial queries, mesh fitting, and rigging"

[lib]
name = "libavicreator"
crate-type = ["cdylib", "rlib", "staticlib"]

[features]
default = ["python", "wasm", "ffi"]
python = ["dep:pyo3", "dep:numpy"]
wasm = ["dep:wasm-bindgen", "dep:js-sys"]
ffi = []

[dependencies]
# Math & Collections
glam = { version = "0.28", features = ["serde", "bytemuck"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytemuck = "1.18"

# glTF I/O
gltf = { version = "1.4", default-features = false, features = ["names", "extras"] }

# Python PyO3 (optional feature)
pyo3 = { version = "0.21", features = ["extension-module", "abi3-py310"], optional = true }
numpy = { version = "0.21", optional = true }

# WebAssembly (optional feature)
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3", optional = true }

[dev-dependencies]
criterion = "0.5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

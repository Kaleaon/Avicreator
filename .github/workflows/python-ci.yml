name: Python CI

on:
  push:
    paths:
      - '**/*.py'
      - '.flake8'
      - '.pylintrc'
      - '.mypy.ini'
      - 'pyrightconfig.json'
      - '.github/workflows/python-ci.yml'
  pull_request:
    paths:
      - '**/*.py'
      - '.flake8'
      - '.pylintrc'
      - '.mypy.ini'
      - 'pyrightconfig.json'
      - '.github/workflows/python-ci.yml'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies and static analysis tools
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pylint mypy pyright

      - name: Run flake8
        run: flake8 .

      - name: Run pylint
        run: pylint --rcfile=.pylintrc $(git ls-files '*.py' | grep -v 'lib/yaml')

      - name: Run mypy
        run: mypy --config-file .mypy.ini .

      - name: Run pyright
        run: pyright

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
        exclude: ^lib/yaml/
      - id: end-of-file-fixer
        exclude: ^lib/yaml/
      - id: check-yaml
        exclude: ^lib/yaml/
      - id: check-added-large-files
        exclude: ^lib/yaml/

  - repo: local
    hooks:
      - id: flake8
        name: flake8
        entry: flake8
        language: system
        types: [python]
        exclude: ^lib/yaml/

      - id: pylint
        name: pylint
        entry: pylint
        language: system
        types: [python]
        exclude: ^lib/yaml/
        args: ["--fail-under=8.0"]

      - id: mypy
        name: mypy
        entry: bash -c "cd .. && mypy --config-file CharMorphExpansion/.mypy.ini --explicit-package-bases CharMorphExpansion"
        language: system
        types: [python]
        pass_filenames: false
